<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" lang="zh-CN"><title id="t">UBOX V3 面额重标与历史事件</title><desc id="d">左边是代理存储中的原始值（旧单位）：A 999,900e18、B 100e18、总供应 1,000,000e18；除以 scale 10000 后，右边读出 A 99.99、B 0.01、总供应 100，decimals 仍为 18。下方警告：历史 Transfer 日志仍是旧单位，若按新单位读会大 10,000 倍。</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b3666"/></marker><marker id="a-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a2be0"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d6656"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#77729f"/></marker></defs><rect width="960" height="540" fill="#ffffff"/><text x="40" y="52" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a1540" text-anchor="start">面额重标：10,000 旧单位 = 1 新单位</text><text x="40" y="82" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55507e" text-anchor="start">存储不改写，读出时统一除以 scale；decimals 仍为 18</text><rect x="40" y="112" width="360" height="200" rx="14" fill="#f3f1fd" stroke="#c9c4e6" stroke-width="1.5"/><text x="60" y="146" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1540" text-anchor="start">代理存储（原始值，旧单位）</text><text x="60" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#3b3666" text-anchor="start">A</text><text x="380" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#3b3666" text-anchor="end">999,900 × 10¹⁸</text><text x="60" y="216" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#3b3666" text-anchor="start">B</text><text x="380" y="216" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#3b3666" text-anchor="end">100 × 10¹⁸</text><text x="60" y="246" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#3b3666" text-anchor="start">supply</text><text x="380" y="246" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#3b3666" text-anchor="end">1,000,000 × 10¹⁸</text><line x1="402" y1="212" x2="548" y2="212" stroke="#0d6656" stroke-width="2.6" marker-end="url(#a-teal)"/><text x="475" y="198" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0d6656" text-anchor="middle">÷ scale 10000</text><rect x="550" y="112" width="370" height="200" rx="14" fill="#e1f5ee" stroke="#0d6656" stroke-width="2"/><text x="570" y="146" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0d6656" text-anchor="start">通过代理读取（新单位）</text><text x="570" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1a1540" text-anchor="start">balanceOf(A)</text><text x="900" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#0d6656" text-anchor="end">99.99</text><text x="570" y="216" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1a1540" text-anchor="start">balanceOf(B)</text><text x="900" y="216" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#0d6656" text-anchor="end">0.01</text><text x="570" y="246" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1a1540" text-anchor="start">totalSupply</text><text x="900" y="246" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#0d6656" text-anchor="end">100</text><text x="570" y="290" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#3b3666" text-anchor="start">decimals() = 18（未改）</text><rect x="40" y="336" width="880" height="176" rx="14" fill="#fde6e3" stroke="#a12a2a" stroke-width="2"/><text x="62" y="370" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="19" font-weight="700" fill="#a12a2a" text-anchor="start">历史日志不会被改写</text><text x="62" y="404.0" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a12a2a" text-anchor="start">成功批次留下的 Transfer(A → B, 100e18) 是旧单位。</text><text x="62" y="431.225" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a12a2a" text-anchor="start">若把它当成新单位来读：会以为 B 收到 100，实际 B 现在是 0.01 —— 大了 10,000 倍。</text><text x="62" y="458.45" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a12a2a" text-anchor="start">升级交易只发出 Upgraded 与 Redenominated(10000)，没有 Transfer（没有铸币或转账）。</text></svg>
