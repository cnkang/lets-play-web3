<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d" lang="en"><title id="t">UBOX V3 redenomination and historical events</title><desc id="d">Left: raw proxy storage in old units, A 999,900e18, B 100e18, supply 1,000,000e18. Divided by scale 10000, the right side reads A 99.99, B 0.01, supply 100, with decimals still 18. Warning below: historical Transfer logs stay in old units and are 10,000 times too large if read as new units.</desc><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b3666"/></marker><marker id="a-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a2be0"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d6656"/></marker><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#77729f"/></marker></defs><rect width="960" height="540" fill="#ffffff"/><text x="40" y="52" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a1540" text-anchor="start">Redenomination: 10,000 old units = 1 new unit</text><text x="40" y="82" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="17" font-weight="400" fill="#55507e" text-anchor="start">Storage is not rewritten; reads divide by scale; decimals stays 18</text><rect x="40" y="112" width="360" height="200" rx="14" fill="#f3f1fd" stroke="#c9c4e6" stroke-width="1.5"/><text x="60" y="146" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1540" text-anchor="start">Proxy storage (raw, old units)</text><text x="60" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#3b3666" text-anchor="start">A</text><text x="380" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#3b3666" text-anchor="end">999,900 × 10¹⁸</text><text x="60" y="216" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#3b3666" text-anchor="start">B</text><text x="380" y="216" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#3b3666" text-anchor="end">100 × 10¹⁸</text><text x="60" y="246" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#3b3666" text-anchor="start">supply</text><text x="380" y="246" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#3b3666" text-anchor="end">1,000,000 × 10¹⁸</text><line x1="402" y1="212" x2="548" y2="212" stroke="#0d6656" stroke-width="2.6" marker-end="url(#a-teal)"/><text x="475" y="198" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0d6656" text-anchor="middle">÷ scale 10000</text><rect x="550" y="112" width="370" height="200" rx="14" fill="#e1f5ee" stroke="#0d6656" stroke-width="2"/><text x="570" y="146" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="18" font-weight="700" fill="#0d6656" text-anchor="start">Read via proxy (new units)</text><text x="570" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1a1540" text-anchor="start">balanceOf(A)</text><text x="900" y="186" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#0d6656" text-anchor="end">99.99</text><text x="570" y="216" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1a1540" text-anchor="start">balanceOf(B)</text><text x="900" y="216" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#0d6656" text-anchor="end">0.01</text><text x="570" y="246" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1a1540" text-anchor="start">totalSupply</text><text x="900" y="246" font-family="ui-monospace, &#x27;SFMono-Regular&#x27;, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#0d6656" text-anchor="end">100</text><text x="570" y="290" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#3b3666" text-anchor="start">decimals() = 18 (unchanged)</text><rect x="40" y="336" width="880" height="176" rx="14" fill="#fde6e3" stroke="#a12a2a" stroke-width="2"/><text x="62" y="370" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="19" font-weight="700" fill="#a12a2a" text-anchor="start">Old logs are never rewritten</text><text x="62" y="404.0" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a12a2a" text-anchor="start">The successful batch left Transfer(A → B, 100e18) in old units.</text><text x="62" y="431.225" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a12a2a" text-anchor="start">Read as new units it says B got 100, but B now holds 0.01: 10,000× too large.</text><text x="62" y="458.45" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Noto Sans SC&#x27;, &#x27;Microsoft YaHei&#x27;, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#a12a2a" text-anchor="start">The upgrade emitted Upgraded and Redenominated(10000), and no Transfer (nothing minted or moved).</text></svg>
