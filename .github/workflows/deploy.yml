# Build the static site and deploy it to GitHub Pages.
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Free GitHub Pages requires the repository to be public.
# Custom domain: letsplayweb3.liukang.com (see public/CNAME).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Override via repository Actions variables. For project Pages use
  # SITE_URL=https://<owner>.github.io and BASE=/<repo>/ (and delete public/CNAME).
  SITE_URL: ${{ vars.SITE_URL || 'https://letsplayweb3.liukang.com' }}
  BASE: ${{ vars.BASE || '/' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow_scope: ${{ steps.indexnow.outputs.scope }}
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: "Secret scan (fact check is skipped in CI: sources are not in this repo)"
        run: node scripts/check-facts.mjs
      - name: Decode OG images (assets/og/*.png.b64), content check (zh + en pairs) and build
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: npm run build
      - name: Check built links, assets and language URLs
        run: npm run check:build
      - name: Prepare optional IndexNow verification and content fingerprints
        id: indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.indexnow.outputs.scope != ''
        with:
          name: indexnow-content
          path: .indexnow/current.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    name: Notify IndexNow
    needs: [build, deploy]
    if: needs.build.outputs.indexnow_scope != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      INDEXNOW_CACHE: indexnow-v1-${{ needs.build.outputs.indexnow_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow-content
          path: .indexnow
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow/submitted.json
          key: ${{ env.INDEXNOW_CACHE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.INDEXNOW_CACHE }}-
      - name: Submit changed URLs after a successful deployment
        id: notify
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs notify
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.notify.outputs.submitted == 'true'
        with:
          path: .indexnow/submitted.json
          key: ${{ env.INDEXNOW_CACHE }}-${{ github.run_id }}-${{ github.run_attempt }}
