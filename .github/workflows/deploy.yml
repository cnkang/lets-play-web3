# Build the static site and deploy it to GitHub Pages.
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Free GitHub Pages requires the repository to be public.
# Suggested repository name: lets-play-web3  →  https://<owner>.github.io/lets-play-web3/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public URLs only — no secrets. For a custom domain, set SITE_URL to it and BASE to '/'.
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE: /${{ github.event.repository.name }}/
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Secret scan (fact check is skipped in CI: sources are not in this repo)
        run: node scripts/check-facts.mjs
      - name: Decode OG images (assets/og/*.png.b64), content check (zh + en pairs) and build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
